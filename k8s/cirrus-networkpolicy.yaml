# Network containment for sdm-mcp on cirrus (k3s, kube-router NetworkPolicy).
#
# The server runs DuckDB over caller-chosen paths (custom covariates, a GeoJSON
# URL), so it must not become an SSRF proxy into the cluster or the network cirrus
# sits on. Egress is cluster DNS plus NRP S3 (s3-west.nrp-nautilus.io) on 443:
# every input it reads and the public-output bucket it writes are there, as are
# GLEN's uploaded GeoJSON files. A GeoJSON URL on any other host is refused.
#
# s3-west's addresses, regenerate if they change:
#   getent ahosts s3-west.nrp-nautilus.io | awk '{print $1}' | sort -u
# (2026-11-12: 137.164.28.180, 2607:f380:4:4007::30)
#
# Ingress is limited to Traefik (kube-system) on 8000. Kubelet probes come from
# the node itself, which kube-router always admits.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdm-mcp-containment
  namespace: mcp
spec:
  podSelector:
    matchLabels:
      app: sdm-mcp
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 8000
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - ipBlock: {cidr: 137.164.28.180/32}
    - ipBlock: {cidr: 2607:f380:4:4007::30/128}
    ports:
    - port: 443
      protocol: TCP
