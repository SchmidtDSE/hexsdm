# Network containment for sdm-mcp on cirrus (k3s, kube-router NetworkPolicy).
# Same shape as geo-query's duckdb-mcp-containment, without its AWS S3 ranges.
#
# The server runs model fits and SQL on its callers' behalf, so what the pod can
# reach is what a request can reach. Egress: cluster DNS and the in-cluster
# RustFS S3 API (rustfs-s3), nothing else. Not the internet, not other
# in-cluster services, not the public s3./minio.carlboettiger.info hosts.
# Occurrence GeoJSON therefore comes inline, as an s3:// path, or as an
# s3.carlboettiger.info (or legacy minio.) link, read in-cluster; other https
# URLs cannot be fetched here.
#
# Ingress: only Traefik (kube-system) on 8000. Kubelet probes come from the node
# itself, which kube-router always admits.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdm-mcp-containment
  namespace: mcp
spec:
  podSelector:
    matchLabels:
      app: sdm-mcp
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 8000
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # rustfs-s3 S3 API only (the console on 9001 is excluded). MinIO's
  # replacement (boettiger-lab/k8s platform/rustfs).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: rustfs
      podSelector:
        matchLabels:
          app: rustfs-s3
    ports:
    - port: 9000
      protocol: TCP
